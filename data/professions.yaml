# Profession Knowledge Base for the Hybrid Career Guidance System
#
# Schema per profession:
#   id              - snake_case unique identifier
#   name_ru, name_en - human names
#   category        - one of: it, engineering, science, healthcare, education,
#                              arts, business, social, trades
#   description_ru  - 1-2 sentence description
#   cluster_preference - balanced | mobilized | depleted | any
#   gardner_ideal   - dict {intelligence_name: ideal_score 0..100}.
#                     Only list intelligences that genuinely matter; others
#                     are treated as neutral (score 50).
#   mbti_preference - dict with 5 keys, signed [-100, +100]:
#                       extraversion (E+ vs I-)
#                       intuition (N+ vs S-)
#                       thinking (T+ vs F-)
#                       judging (J+ vs P-)
#                       assertive (A+ vs T-)
#                     0 = neutral, omit unused dimensions.
#   top_roles       - 3-5 Neiry role names (Focus Expert, Optimist, ...,
#                     Empathizer) that align with this profession.
#
# Trait estimates draw on Holland's RIASEC theory, Gardner's intelligences
# work, and consensus MBTI-career mappings (Tieger et al., 16Personalities).
# They are reasonable starting points, not validated empirical scores.

